<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Around the US." />
    <meta name="author" content="Cinthia Hernandez Sotelo" />
    <meta name="keywords" content="U.S., places, cities, united states" />
    <title>Cinthia Hernández</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./pages/index.css" />
    <script src="./scripts/validate.js" defer></script>
    <script src="./scripts/index.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="./images/header.svg"
          class="header__logo"
          alt="Around the US"
        />
      </header>

      <main class="content">
        <section class="profile">
          <div class="profile__container">
            <img
              src="./images/Jacques.jpg"
              alt="Jacques Cousteau"
              class="profile__avatar"
            />

            <div class="profile__info">
              <div class="profile__title-wrapper">
                <h1 class="profile__name">Jacques Cousteau</h1>
                <button type="button" class="profile__edit-button"></button>
              </div>
              <p class="profile__description">Explorador</p>
            </div>
            <button type="button" class="profile__add-button">+</button>
          </div>
        </section>

        <section class="cards"></section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">© 2026 Around The U.S.</p>
      </footer>
    </div>
    <section class="popup">
      <div class="popup__container">
        <button type="button" class="popup__close"></button>

        <h2 class="popup__title">Editar perfil</h2>
        <form class="popup__form" name="edit-profile" novalidate>
          <div class="popup__field">
            <input
              type="text"
              name="name"
              id="name-input"
              class="popup__input"
              placeholder="Nombre"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="popup__input-error name-input-error"></span>
          </div>

          <div class="popup__field">
            <input
              type="text"
              name="about"
              id="about-input"
              class="popup__input"
              placeholder="Acerca de mi"
              minlength="2"
              maxlength="200"
              required
            />
            <span class="popup__input-error about-input-error"></span>
          </div>

          <button type="submit" class="popup__button">Guardar</button>
        </form>
      </div>
    </section>
    <template id="card-template">
      <div class="card">
        <img class="card__image" alt="" />
        <button type="button" class="card__button-delete"></button>
        <div class="card__info">
          <p class="card__text"></p>
          <button type="button" class="card__button-like"></button>
        </div>
      </div>
    </template>
    <section class="popup" id="popup-add-card">
      <div class="popup__container">
        <button type="button" class="popup__close"></button>

        <h2 class="popup__title">New Place</h2>
        <form class="popup__form" name="add-card" novalidate>
          <div class="popup__field">
            <input
              type="text"
              name="title"
              id="title-input"
              class="popup__input"
              placeholder="Title"
              required
              minlength="2"
              maxlength="30"
            />
            <span class="popup__input-error title-input-error"></span>
          </div>

          <div class="popup__field">
            <input
              type="url"
              name="url"
              id="url-input"
              class="popup__input"
              placeholder="Image URL"
              required
            />
            <span class="popup__input-error url-input-error"></span>
          </div>

          <button type="submit" class="popup__button">Guardar</button>
        </form>
      </div>
    </section>

    <section class="popup" id="popup-image">
      <div class="popup__container popup__container_type_image">
        <button type="button" class="popup__close"></button>
        <img class="popup__image" src="" alt="" />
        <p class="popup__caption"></p>
      </div>
    </section>
  </body>
</html>
